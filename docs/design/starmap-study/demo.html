<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>开局一艘船，我成了星际首富 · 星图场景演示</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ui/meridian-mark.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* The resource bar, navigation, menu and overview reuse the original product CSS and markup. */
    #map-container { background:radial-gradient(ellipse at 67% 24%,#8d664828,transparent 45%),radial-gradient(ellipse at 7% 75%,#1d324834,transparent 46%),#0b1424; }
    #labels { position:absolute; inset:0; pointer-events:none; }
    #labels .port-label { position:absolute; transform:translateX(-50%); display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 6px; border:0; border-radius:0; background:transparent; box-shadow:none; color:#f4e8d8; pointer-events:auto; white-space:nowrap; text-shadow:0 1px 3px #02060b; }
    #labels .port-label strong { font:600 15px system-ui,sans-serif; }
    #labels .port-label[aria-pressed="true"] strong { font-weight:700; }
    #labels .port-type { display:inline-flex; align-items:center; min-height:17px; padding:0 6px; border:1px solid var(--type-border); border-radius:4px; background:linear-gradient(var(--type-top),var(--type-bottom)); color:var(--type-text); font:600 11px system-ui,sans-serif; text-shadow:none; }
    #labels .port-label[data-type="agricultural"] { --type-top:#304b3b; --type-bottom:#15291f; --type-border:#84bf94; --type-text:#dcf4d8; }
    #labels .port-label[data-type="mining"] { --type-top:#634525; --type-bottom:#302519; --type-border:#d7a362; --type-text:#ffe5b1; }
    #labels .port-label[data-type="industrial"] { --type-top:#324b61; --type-bottom:#192839; --type-border:#8fb4d4; --type-text:#dbeeff; }
    .study-controls { display:grid; gap:16px; margin:20px 0; }
    .study-controls label { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .study-controls select { min-height:44px; padding:8px 12px; border:1px solid var(--ui-line-default); border-radius:10px; background:var(--merchant-inset); }
    #metrics { display:block; margin-top:16px; color:var(--ui-text-secondary); font-size:12px; line-height:1.6; }
  </style>
</head>
<body id="merchant-game" class="ui-redesign" data-merchant="true" data-active-view="starmap">
  <div id="game-shell">
    <aside id="merchant-resource-bar" aria-label="资源栏">
        <div class="merchant-resource"><span class="merchant-resource-symbol" aria-hidden="true">◈</span><span>CR</span><strong id="credits">1,000,000</strong></div>
          <details id="company-tools" class="company-menu">
            <summary aria-label="更多功能" title="更多功能"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="7"/></svg></summary>
            <div class="company-menu-panel" aria-label="公司工具">
              <button class="company-tool-link" type="button" id="demo-settings" aria-label="设置" title="设置"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 6 0 .6 3.1 2.4 1.4 3-.9 3 5.2-2.4 2.1v2.8l2.4 2.1-3 5.2-3-.9-2.4 1.4L15 27H9l-.6-3.1L6 22.5l-3 .9-3-5.2 2.4-2.1v-2.8L0 11.2l3-5.2 3 .9 2.4-1.4Z" transform="translate(3 0) scale(.75)"/></svg></button>
              <button class="company-tool-link" type="button" aria-disabled="true" aria-label="存档" title="存档"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3h1Z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/><path d="M14 5v2"/></svg></button>
            </div>
          </details>
      </aside>
    <aside id="status-bar" aria-label="航运导航">
        <!-- Bottom navigation tabs -->
        <nav class="bottom-nav" id="bottom-nav" aria-label="经营主导航">
          <button class="bottom-nav-btn" type="button" data-view="tasks" title="经营任务" aria-pressed="false" aria-disabled="true">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 12h18M12 3v18M5 5l14 14M5 19 19 5"/></svg>
            <span class="merchant-nav-copy">经营</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="ships" title="船只" aria-pressed="false" aria-disabled="true">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 8 17-8-4-8 4 8-17Z"/></svg>
            <span class="merchant-nav-copy">船只</span>
          </button>
          <button class="bottom-nav-btn active" type="button" data-view="starmap" title="星图 · 查看飞船运行" aria-pressed="true" aria-current="page">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="10" cy="19" r="2"/><path d="m8 6 8 3M17 11l-6 6M6 8l3 9"/></svg>
            <span class="merchant-nav-copy">星图</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="market" title="市场" aria-pressed="false" aria-disabled="true">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9 12 3l9 6v12H3V9Zm5 12v-8h8v8M3 9h18"/></svg>
            <span class="merchant-nav-copy">市场</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="reports" title="报告" aria-pressed="false" aria-disabled="true">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 18 9 6l7 9 4-12M4 18h16"/></svg>
            <span class="merchant-nav-copy">报告</span>
          </button>
        </nav>
      </aside>
    <main id="game-main">
      <section id="map-section" class="workspace-surface workspace-surface--map is-active" role="region" aria-label="星图场景演示">
        <div id="map-container"><div id="labels"></div></div>
        <button id="overview" type="button" class="merchant-map-overview" aria-label="星图全景" title="星图全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg></button>
      </section>
    </main>
  </div>
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="study-tools-title" aria-hidden="true" inert>
    <div class="modal-box">
      <div class="merchant-tools-heading"><h2 id="study-tools-title">星图演示控制</h2><button id="close-demo-settings" type="button" aria-label="关闭演示控制">×</button></div>
      <p>示例四港航次，仅用于查看场景效果。</p>
      <div class="study-controls">
        <label for="quality">画质<select id="quality"><option value="balanced">均衡</option><option value="light">轻量</option></select></label>
        <button id="motion" type="button" aria-pressed="false">暂停动画</button>
        <button id="view" type="button" aria-pressed="true">强调航线</button>
      </div>
      <span id="metrics">初始化渲染…</span>
    </div>
  </div>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>
