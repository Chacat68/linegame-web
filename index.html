<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>蓝脉航路 · 2.0</title>
    <link rel="icon" type="image/svg+xml" href="assets/ui/meridian-mark.svg" />
    <link id="app-styles" rel="stylesheet" href="css/style.css?v=2.0.0" />
    <link rel="stylesheet" href="css/startup-loader.css?v=2.0.0" />
  </head>
  <body id="merchant-game" class="ui-redesign">
    <div
      id="startup-loader"
      class="startup-loader"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="游戏正在加载"
    >
      <div class="startup-loader__stars" aria-hidden="true"></div>
      <div class="startup-loader__scanline" aria-hidden="true"></div>
      <div class="startup-loader__panel">
        <div class="startup-loader__brand" aria-hidden="true">
          <span class="startup-loader__brand-orbit"></span>
          <span class="startup-loader__brand-core"></span>
        </div>
        <p class="startup-loader__eyebrow">BLUE MERIDIAN / VERSION 2.0</p>
        <h1 class="startup-loader__title">蓝脉航路</h1>
        <p id="startup-loader-status" class="startup-loader__status">正在建立航路连接</p>
        <div
          id="startup-loader-progress"
          class="startup-loader__progress"
          role="progressbar"
          aria-label="游戏加载进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
          aria-valuetext="正在建立航路连接"
        >
          <span id="startup-loader-progress-fill" class="startup-loader__progress-fill" style="width: 8%"></span>
        </div>
        <div class="startup-loader__meta">
          <span id="startup-loader-stage">SYSTEM LINK</span>
          <span id="startup-loader-percent">08%</span>
        </div>
        <button id="startup-loader-retry" class="startup-loader__retry" type="button" hidden>
          重新连接
        </button>
        <div id="startup-loader-recovery" class="startup-loader__recovery" hidden>
          <p id="startup-loader-recovery-status" role="status" aria-live="polite">原始自动存档已保留，游戏尚未开始。你可以重试或先导出备份。</p>
          <div class="startup-loader__actions">
            <button id="startup-loader-export" class="startup-loader__retry" type="button">导出原始存档</button>
            <button id="startup-loader-restart" class="startup-loader__retry" type="button">重新开始</button>
          </div>
          <div id="startup-loader-confirm" hidden>
            <p>重新开始会删除当前自动存档，手动存档会保留。请先导出需要的进度。</p>
            <div class="startup-loader__actions">
              <button id="startup-loader-cancel" class="startup-loader__retry" type="button">返回恢复选项</button>
              <button id="startup-loader-confirm-restart" class="startup-loader__retry" type="button">确认删除自动存档并开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="game-shell">
      <!-- ================================================================
       Header
  ================================================================ -->
      <aside id="merchant-resource-bar" aria-label="资源栏">
        <div class="merchant-resource"><span class="merchant-resource-symbol" aria-hidden="true">◈</span><span>CR</span><strong id="credits">1,000</strong></div>
          <details id="company-tools" class="company-menu">
            <summary aria-label="更多功能" title="更多功能"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="7"/></svg></summary>
            <div class="company-menu-panel" aria-label="公司工具">
              <button class="company-tool-link" type="button" data-company-action="settings" aria-label="设置" title="设置"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 6 0 .6 3.1 2.4 1.4 3-.9 3 5.2-2.4 2.1v2.8l2.4 2.1-3 5.2-3-.9-2.4 1.4L15 27H9l-.6-3.1L6 22.5l-3 .9-3-5.2 2.4-2.1v-2.8L0 11.2l3-5.2 3 .9 2.4-1.4Z" transform="translate(3 0) scale(.75)"/></svg></button>
              <button class="company-tool-link" type="button" data-company-action="saves" aria-label="存档" title="存档"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3h1Z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/><path d="M14 5v2"/></svg></button>
            </div>
          </details>
      </aside>


      <!-- ================================================================
       Main
  ================================================================ -->
      <aside id="status-bar" aria-label="航运导航">
        <!-- Bottom navigation tabs -->
        <nav class="bottom-nav" id="bottom-nav" aria-label="经营主导航">
          <button class="bottom-nav-btn active" type="button" data-view="tasks" title="经营任务" aria-pressed="true" aria-current="page">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 12h18M12 3v18M5 5l14 14M5 19 19 5"/></svg>
            <span class="merchant-nav-copy">经营</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="ships" title="船只" aria-pressed="false" hidden>
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 8 17-8-4-8 4 8-17Z"/></svg>
            <span class="merchant-nav-copy">船只</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="starmap" title="星图 · 查看飞船运行" aria-pressed="false">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="10" cy="19" r="2"/><path d="m8 6 8 3M17 11l-6 6M6 8l3 9"/></svg>
            <span class="merchant-nav-copy">星图</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="market" title="市场" aria-pressed="false" hidden>
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9 12 3l9 6v12H3V9Zm5 12v-8h8v8M3 9h18"/></svg>
            <span class="merchant-nav-copy">市场</span>
          </button>
          <button class="bottom-nav-btn" type="button" data-view="reports" title="报告" aria-pressed="false">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 18 9 6l7 9 4-12M4 18h16"/></svg>
            <span class="merchant-nav-copy">报告</span>
          </button>
        </nav>
      </aside>

<main id="game-main">
  <section id="merchant-task-workspace" class="workspace-surface merchant-workspace-base is-active" role="region" aria-label="经营工作区" aria-hidden="false" tabindex="-1" data-workspace-active="true"></section>
  <section id="merchant-ship-workspace" class="workspace-surface" role="region" aria-label="船坞工作区" aria-hidden="true" tabindex="-1" inert data-workspace-active="false"></section>
  <section id="map-section" class="workspace-surface workspace-surface--map" role="region" aria-label="星图工作区" aria-hidden="true" tabindex="-1" inert data-workspace-active="false"><div id="map-container"><canvas id="starmap-three-canvas" aria-label="星图场景" style="visibility: hidden;"></canvas></div></section>
  <section id="merchant-market-workspace" class="workspace-surface" role="region" aria-label="市场工作区" aria-hidden="true" tabindex="-1" inert data-workspace-active="false"></section>
  <section id="merchant-report-workspace" class="workspace-surface" role="region" aria-label="报告工作区" aria-hidden="true" tabindex="-1" inert data-workspace-active="false"></section>
</main></div>
<div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="merchant-tools-title" aria-hidden="true" inert><div class="modal-box" tabindex="-1"></div></div>
<script type="module" src="js/main.js"></script>
</body></html>
